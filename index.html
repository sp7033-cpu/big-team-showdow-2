<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Big Team Showdown</title><style>
:root{font-family:Inter,Arial,sans-serif;color:#f4f7ff;background:#0d1830}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#233f72,#0d1830 55%)}main{max-width:950px;margin:auto;padding:22px}h1{font-size:clamp(26px,5vw,46px);margin:10px 0}h2{margin:0 0 14px}.muted{color:#b4c2dc}.card{background:#1c2d4c;border:1px solid #365076;border-radius:18px;padding:22px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#253b60;padding:12px;border-radius:12px;text-align:center}.stat strong{font-size:25px;display:block}button,input{font:inherit;border-radius:11px;padding:13px 15px}input{width:100%;border:1px solid #61779d;background:#0c1930;color:white;margin:7px 0 12px}button{border:0;background:#5b83f7;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.4;cursor:default}.secondary{background:#344d75}.option{width:100%;text-align:left;background:#344d75;min-height:60px}.option.selected{background:#166534}.option:disabled{opacity:1}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.pill{background:#344d75;border-radius:100px;padding:7px 12px;font-size:13px}.bar{height:9px;background:#344d75;border-radius:20px;overflow:hidden;margin:5px 0 14px}.fill{height:100%;background:#73a1ff}.error{color:#ffb4b4}.good{color:#8ce3ae}#qr{background:white;padding:10px;border-radius:10px;display:inline-block;min-height:180px;min-width:180px}#qr img{display:block}a{color:#a8c8ff}#app{max-width:820px;margin:auto}@media(max-width:500px){main{padding:13px}.card{padding:15px}.grid{grid-template-columns:1fr}}
</style></head><body><main><div class="top"><div><div class="muted">⚡ LIVE TEAM GAME</div><h1>The Big Team Showdown</h1></div><span class="pill">Workplace Edition</span></div><div id="app"></div></main><script src="/socket.io/socket.io.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const socket=io();let state=null,identity=null,host=null,selected=null;const app=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pinFromUrl=new URLSearchParams(location.search).get('pin');const saved=JSON.parse(localStorage.getItem('bts-player')||'null');const savedHost=JSON.parse(sessionStorage.getItem('bts-host')||'null');
function call(event,data){return new Promise(resolve=>socket.emit(event,data,resolve))}function msg(s){document.getElementById('message')&&(document.getElementById('message').textContent=s)}
function leader(s){const ranked=[...s.teams].sort((a,b)=>b.score-a.score);return ranked.map((t,i)=>`<div class="top"><b>${i+1}. ${esc(t.name)}</b><span>${t.score} pts · ${t.count} players</span></div><div class="bar"><div class="fill" style="width:${ranked[0].score?100*t.score/ranked[0].score:0}%"></div></div>`).join('')}
function start(){app.innerHTML=`<section class="card"><h2>Join the game</h2><p class="muted">Enter the room PIN shown on the meeting screen.</p><label>Room PIN<input id="pin" inputmode="numeric" maxlength="6" value="${esc(pinFromUrl||'')}"></label><label>Nickname<input id="name" maxlength="24" placeholder="e.g. Process Ninja"></label><button id="join">Join team</button><p class="error" id="message"></p></section><section class="card"><h2>Hosting the meeting?</h2><p class="muted">Create a game and share its QR code with up to 50 colleagues.</p><button class="secondary" id="create">Create host room</button></section>`;document.getElementById('join').onclick=join;document.getElementById('create').onclick=create}
async function create(){const r=await call('create',{});if(r.ok){host=r;sessionStorage.setItem('bts-host',JSON.stringify(r));history.replaceState(null,'','/?host=1');render()}}
async function join(){const pin=document.getElementById('pin').value.trim(),name=document.getElementById('name').value.trim();const r=await call('join',{pin,name});if(r.ok){identity={pin,token:r.token,name:r.name,team:r.team};localStorage.setItem('bts-player',JSON.stringify(identity));history.replaceState(null,'','/?pin='+pin);socket.emit('sync',{pin});render()}else msg(r.error)}
async function act(action){const r=await call('host-action',{pin:host.pin,secret:host.secret,action});if(r.error)alert(r.error)}
async function answer(i){if(selected!==null)return;const r=await call('answer',{pin:identity.pin,token:identity.token,option:i});if(r.ok){selected=i;render()}else alert(r.error)}
function render(){if(!host&&!identity)return start();if(!state){app.innerHTML='<section class="card">Connecting to game…</section>';return}if(host){app.innerHTML=`<div class="card"><div class="top"><h2>Host control centre</h2><span class="pill">Room ${esc(host.pin)}</span></div><div class="stats"><div class="stat"><strong>${state.playerCount}</strong>Players</div><div class="stat"><strong>${state.teams.length}</strong>Teams</div><div class="stat"><strong>${Math.max(0,state.index+1)}/12</strong>Questions</div></div></div>${state.status==='lobby'?`<div class="card"><h2>Scan to join</h2><div id="qr"></div><p><strong>PIN: ${esc(host.pin)}</strong></p><p><a id="joinlink" target="_blank" href="/?pin=${esc(host.pin)}">${esc(location.origin+'/?pin='+host.pin)}</a></p><button onclick="act('next')" ${state.playerCount<1?'disabled':''}>Start the game</button></div>`:''}${questionHtml(true)}<div class="card"><h2>Team leaderboard</h2>${leader(state)}</div>${state.status==='results'?`<div class="card"><h2>Individual MVPs</h2>${[...state.players].sort((a,b)=>b.score-a.score).slice(0,5).map((p,i)=>`<p>${i+1}. ${esc(p.name)} — ${p.score} pts</p>`).join('')}</div>`:''}<div class="card"><h2>Host actions</h2><div class="top">${state.status==='question'?'<button onclick="act(\'reveal\')">Lock & reveal answer</button>':''}${state.status==='reveal'?'<button onclick="act(\'next\')">Next question →</button>':''}<button class="secondary" onclick="if(confirm('Reset the game and remove players?'))act('reset')">Reset room</button></div></div>`;if(state.status==='lobby'){const el=document.getElementById('qr');if(window.QRCode)new QRCode(el,{text:location.origin+'/?pin='+host.pin,width:180,height:180});else el.textContent='Use the join link below'}return}app.innerHTML=`<div class="card"><div class="top"><h2>Welcome, ${esc(identity.name)}!</h2><span class="pill">${esc(identity.team)}</span></div><p class="muted">Room ${esc(identity.pin)}</p></div>${questionHtml(false)}<div class="card"><h2>Team standings</h2>${leader(state)}</div>`}
function questionHtml(isHost){if(state.status==='lobby')return isHost?'':'<div class="card"><h2>Waiting for host to start…</h2><p class="muted">Your team is ready. Keep this page open.</p></div>';if(state.status==='results')return `<div class="card"><h2>🏆 Game complete!</h2><p>Winning team: <strong>${esc([...state.teams].sort((a,b)=>b.score-a.score)[0].name)}</strong></p></div>`;const q=state.question;if(!q)return '';const submitted=selected!==null;return `<div class="card"><div class="top"><span class="pill">${esc(q.round)} · Question ${state.index+1}/12</span><span class="pill">${q.points} points</span></div><h2 style="margin-top:18px">${esc(q.text)}</h2><div class="grid">${q.options.map((a,i)=>`<button class="option ${!isHost&&submitted&&selected===i?'selected':''}" ${isHost||submitted||state.status!=='question'?'disabled':''} onclick="answer(${i})">${'ABCD'[i]}. ${esc(a)}</button>`).join('')}</div><p class="muted">${state.status==='question'?`${state.answered}/${state.playerCount} answered · ${isHost?'Waiting for answers':'Select one answer'}`:state.answer===-1?'Opinion poll — participation points awarded':`Correct answer: ${'ABCD'[state.answer]}. ${esc(q.options[state.answer])}`}</p>${!isHost&&submitted?'<p class="good">✓ Answer submitted</p>':''}<p id="countdown" class="muted"></p></div>`}
socket.on('state',s=>{if(!host){const old=state;state=s;if(!old||old.index!==s.index)selected=null;render()}});socket.on('host-state',s=>{if(host){state=s;render()}});socket.on('connect',async()=>{if(host){socket.emit('resume-host',host,()=>{});return}if(identity){const r=await call('join',identity);if(r.ok){socket.emit('sync',{pin:identity.pin});return}identity=null;localStorage.removeItem('bts-player')}if(savedHost){const r=await call('resume-host',savedHost);if(r.ok){host=savedHost;socket.emit('sync',{pin:host.pin});return}}start()});setInterval(()=>{const el=document.getElementById('countdown');if(el&&state?.status==='question'&&state.deadline)el.textContent='Time remaining: '+Math.max(0,Math.ceil((state.deadline-Date.now())/1000))+' seconds'},250);start();
</script></body></html>
